<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStay - Prototype Refonte</title>
    
    <!-- Importation des polices "Magazine" et "Moderne" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Chargement de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuration de la charte graphique -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#F9FAFB',     // Gris très clair
                            text: '#111827',   // Anthracite
                            accent: '#5A6B5D', // Vert Sauge
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Masquer la barre de défilement pour un look app native */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animation d'apparition douce des pages */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Styles dynamiques pour la navigation gérés par CSS */
        .nav-btn.active { background-color: #F9FAFB; }
        .nav-btn.active .nav-icon { stroke: #5A6B5D; stroke-width: 2; }
        .nav-btn.active .nav-label { color: #111827; }
        
        .nav-btn:not(.active):hover { background-color: rgba(249, 250, 251, 0.5); }
        .nav-btn:not(.active) .nav-icon { stroke: #9CA3AF; stroke-width: 1.5; }
        .nav-btn:not(.active) .nav-label { color: #9CA3AF; }
    </style>
</head>
<body class="min-h-screen bg-gray-200 flex items-center justify-center p-8 font-sans selection:bg-brand-accent selection:text-white">

    <!-- CONTENEUR SMARTPHONE -->
    <div class="w-[390px] h-[844px] bg-brand-bg rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.15)] ring-8 ring-white relative overflow-hidden flex flex-col text-brand-text">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center px-8 pt-12 pb-6">
            <div class="text-2xl font-bold tracking-tighter font-serif">
                mystay<span class="text-brand-accent">.</span>
            </div>
            <button class="flex flex-col space-y-1.5 p-2 group cursor-pointer">
                <span class="w-6 h-[1.5px] bg-[#111827] transition-all group-hover:bg-brand-accent"></span>
                <span class="w-4 h-[1.5px] bg-[#111827] self-end transition-all group-hover:bg-brand-accent group-hover:w-6"></span>
            </button>
        </header>

        <!-- ZONE DE CONTENU (Scrollable) -->
        <div class="flex-1 overflow-y-auto px-8 no-scrollbar pb-32">
            
            <!-- === PAGE 1 : ACCUEIL === -->
            <div id="page-accueil" class="fade-in mt-6">
                <h1 class="text-[40px] leading-[1.1] mb-10 font-medium font-serif">
                    Où vous mène <br />votre prochain <br /><i class="text-gray-400 font-serif">séjour ?</i>
                </h1>

                <!-- Barre de recherche -->
                <div class="bg-white rounded-2xl p-4 flex items-center space-x-3 shadow-[0_8px_30px_rgba(0,0,0,0.04)] mb-8 transition-transform hover:scale-[1.02] cursor-text">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" placeholder="Ville ou code postal..." class="bg-transparent border-none outline-none w-full text-[15px] placeholder-gray-400 focus:ring-0">
                </div>

                <!-- Call-to-Action QR Code -->
                <button class="w-full text-left bg-brand-accent/5 border border-brand-accent/10 rounded-2xl p-5 flex items-center space-x-4 transition-colors hover:bg-brand-accent/10">
                    <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-sm">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6B5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <rect x="7" y="7" width="3" height="3"></rect>
                            <rect x="14" y="7" width="3" height="3"></rect>
                            <rect x="7" y="14" width="3" height="3"></rect>
                            <rect x="14" y="14" width="3" height="3"></rect>
                        </svg>
                    </div>
                    <div>
                        <p class="font-semibold text-[15px] text-brand-text">J'ai un code MyStay</p>
                        <p class="text-[13px] text-gray-500 mt-0.5">Scannez pour accéder au logement</p>
                    </div>
                </button>
            </div>

            <!-- === PAGE 2 : LE GUIDE === -->
            <div id="page-guide" class="hidden fade-in mt-2">
                <div class="mb-8">
                    <p class="text-[11px] font-bold tracking-widest text-gray-400 uppercase mb-3">Le Guide Local</p>
                    <h1 class="text-[34px] leading-tight font-medium font-serif">
                        Saint-Nicolas<br />de-Véroce
                    </h1>
                    
                    <!-- Pilule Météo -->
                    <button class="mt-4 inline-flex items-center space-x-2 bg-white px-4 py-2 rounded-full shadow-[0_2px_10px_rgba(0,0,0,0.03)] text-[13px] font-medium border border-gray-100 transition-colors hover:bg-gray-50">
                        <span class="text-xl">⛅️</span>
                        <span>12°C</span>
                        <span class="text-gray-300">|</span>
                        <span class="text-brand-accent">Prévisions</span>
                    </button>
                </div>

                <!-- Empty State -->
                <div class="mt-16 flex flex-col items-center text-center px-4">
                    <div class="mb-8 text-brand-accent/20">
                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <path d="m9 12 2 2 4-4"></path>
                        </svg>
                    </div>
                    
                    <h3 class="text-lg font-semibold mb-2">Bientôt disponible</h3>
                    <p class="text-[15px] text-gray-500 leading-relaxed mb-8">
                        Nous préparons nos meilleures adresses et recommandations secrètes pour cette destination.
                    </p>
                    
                    <button onclick="switchPage('accueil')" class="bg-[#111827] text-white px-8 py-3.5 rounded-xl text-[14px] font-medium transition-transform hover:scale-105">
                        Explorer d'autres villes
                    </button>
                </div>
            </div>

        </div>

        <!-- BOTTOM NAVIGATION (Glassmorphism) -->
        <div class="absolute bottom-6 left-6 right-6 z-50">
            <nav class="bg-white/80 backdrop-blur-xl border border-white rounded-3xl shadow-[0_8px_30px_rgba(0,0,0,0.08)] flex justify-between px-2 py-2">
                
                <!-- Bouton Nav 1 : Accueil -->
                <button onclick="switchPage('accueil')" id="nav-btn-accueil" class="nav-btn active flex flex-col items-center justify-center w-20 py-2 rounded-2xl transition-all duration-300 cursor-pointer">
                    <div class="mb-1 transition-colors">
                        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    </div>
                    <span class="nav-label text-[10px] font-medium transition-colors">Accueil</span>
                </button>

                <!-- Bouton Nav 2 : Le Guide -->
                <button onclick="switchPage('guide')" id="nav-btn-guide" class="nav-btn flex flex-col items-center justify-center w-20 py-2 rounded-2xl transition-all duration-300 cursor-pointer">
                    <div class="mb-1 transition-colors">
                        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
                    </div>
                    <span class="nav-label text-[10px] font-medium transition-colors">Le Guide</span>
                </button>

                <!-- Bouton Nav 3 : Favoris (Inactif dans ce prototype) -->
                <button class="nav-btn flex flex-col items-center justify-center w-20 py-2 rounded-2xl transition-all duration-300 cursor-pointer">
                    <div class="mb-1 transition-colors">
                        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </div>
                    <span class="nav-label text-[10px] font-medium transition-colors">Favoris</span>
                </button>

            </nav>
        </div>

    </div>

    <!-- SCRIPT DE NAVIGATION JS -->
    <script>
        function switchPage(pageName) {
            // 1. Masquer toutes les pages
            document.getElementById('page-accueil').classList.add('hidden');
            document.getElementById('page-guide').classList.add('hidden');
            
            // 2. Afficher la page demandée (en réinitialisant l'animation CSS)
            const targetPage = document.getElementById('page-' + pageName);
            targetPage.classList.remove('hidden');
            // Petite astuce pour relancer l'animation "fade-in" à chaque clic
            targetPage.style.animation = 'none';
            targetPage.offsetHeight; /* trigger reflow */
            targetPage.style.animation = null; 

            // 3. Mettre à jour le style visuel des boutons de la barre de navigation
            document.getElementById('nav-btn-accueil').classList.remove('active');
            document.getElementById('nav-btn-guide').classList.remove('active');
            
            if(pageName === 'accueil' || pageName === 'guide') {
                document.getElementById('nav-btn-' + pageName).classList.add('active');
            }
        }
    </script>
</body>
</html>
